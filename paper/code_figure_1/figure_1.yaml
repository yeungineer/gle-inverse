
figure:
  stem: Figure_1
  dpi: 600
  seeds: [42]
  brownian_trajectory_time_window: [0.0, 20.0]
  levy_trajectory_time_window: [0.0, 200.0]
  memory_time_window: [2.0, 16.0]
  state_quantiles: [0.01, 0.99]

cases:
  brownian:
    source_config: run/configs/kramers_moyal_brownian.yaml
    overrides:
      generation.km_samples: euler_oracle
      generation.simulation.num_steps: 2000
      noise.diffusion: constant
  brownian_levy:
    source_config: run/configs/kramers_moyal_brownian_levy.yaml
    overrides:
      generation.km_samples: euler_oracle
      generation.simulation.num_steps: 2000
      noise.diffusion: cosine
