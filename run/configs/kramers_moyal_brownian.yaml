kernel: { type: "complex_exp" }
noise: { type: "brownian", diffusion: "constant" }
force: { type: "zero" }

generation:
  simulation:
    seed: 42
    dt: 0.01
    L: 3000
    num_steps: 2000
  km_samples: euler_oracle

phase1:
  observation: { r_obs: 1, sigma_obs: 0.0 }
  estimation:
    lr: 0.002
    epochs: 500

phase2:
  observation: { r_obs: 1, sigma_obs: 0.0 }
  estimation:
    degree: 3
    num_basis: 12
    t_max: 30.0
