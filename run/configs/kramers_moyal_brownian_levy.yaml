kernel: { type: "complex_exp" }
noise: {type: "brownian_levy", diffusion: "cosine", alpha: 1.6, kappa: 0.12 }
force: { type: "zero" }

generation:
  simulation:
    seed: 42
    dt: 0.01
    L: 3000
    num_steps: 2000
  km_samples: euler_oracle

phase1:
  observation: { r_obs: 1, sigma_obs: 0.0 }
  estimation:
    lr: 0.002
    epochs: 500
    levy_epsilon: 1.0

phase2:
  observation: { r_obs: 1, sigma_obs: 0.0 }
  estimation:
    num_basis: 12
    t_max: 30.0
