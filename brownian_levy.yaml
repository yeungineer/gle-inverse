kernel: { type: complex_exp }
noise: { type: brownian_levy, diffusion: cosine, alpha: 1.6, kappa: 0.12 }
force: { type: zero }

simulation: { seed: 42, dt: 0.01, substeps: 5, L: 3000, num_paths: 1000 }
observation: { sigma_obs: 0.0 }
moments: { epsilon: 1.0, state_radius: 4.0, history_K: 12, history_a: 0.5 }
evaluation: { sigma_range: [-2.0, 2.0] }
compute: { device: cpu }

step1:
  K_grid: [4, 6, 8, 10, 12]
  a_grid: [0.25, 0.5, 1.0, 2.0]
  folds: 5
  t_max: 30.0

step2: { lr: 0.005, epochs: 16, batch_size: 16384, levy_q: 2.0, levy_bins: 2 }
